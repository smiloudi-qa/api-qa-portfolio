Déclenchement automatique : à chaque 'push' ou 'pull request' sur la branche main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  run-api-tests:
    runs-on: ubuntu-latest

    steps:
      # 1. Récupérer le code source du dépôt
      
name: Checkout repository
      uses: actions/checkout@v4

      # 2. Installer Node.js sur la machine virtuelle GitHub
      
name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

      # 3. Installer les dépendances du projet
      
name: Install dependencies
      run: npm ci

      # 4. Lancer les tests Playwright
      
name: Run Playwright API Tests
      run: npm test

      # 5. Sauvegarder le rapport HTML même si un test échoue
      
name: Save Playwright HTML Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 7